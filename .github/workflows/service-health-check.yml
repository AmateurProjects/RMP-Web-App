##############################################################
# Service Health Check — GitHub Actions Workflow
#
# Pings every ArcGIS REST endpoint configured in config.json
# and reports which services are UP vs DOWN.
#
# Runs daily at 06:00 UTC (≈ midnight MT) and on-demand.
# Creates a GitHub Issue when any service is DOWN.
##############################################################

name: Service Health Check

on:
  schedule:
    # Daily at 06:00 UTC (midnight Mountain Time)
    - cron: "0 6 * * *"
  workflow_dispatch:         # manual trigger

permissions:
  issues: write              # to create issues on failure

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run health checks
        id: check
        run: node .github/scripts/check-services.js

      - name: Create issue on failure
        if: steps.check.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/scripts/health-report.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);

            // Check for an existing open issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'service-health',
              per_page: 5
            });

            if (issues.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `## Update — ${today}\n\n${body}`
              });
              console.log(`Updated existing issue #${issues[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Service Health Alert — ${today}`,
                body,
                labels: ['service-health']
              });
              console.log('Created new service health issue');
            }
