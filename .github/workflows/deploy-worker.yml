name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/r2-metadata-cache/**"

  # Manual trigger from Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: workers/r2-metadata-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/r2-metadata-cache

      - name: Post-deploy – trigger metadata refresh
        if: success()
        env:
          WORKER_URL: ${{ secrets.METADATA_WORKER_URL }}
          REFRESH_SECRET: ${{ secrets.METADATA_REFRESH_SECRET }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$REFRESH_SECRET" ]; then
            echo "⚠️ Skipping refresh trigger — METADATA_WORKER_URL or METADATA_REFRESH_SECRET not set"
            exit 0
          fi

          echo "Triggering POST /refresh on deployed worker..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${WORKER_URL}/refresh" \
            -H "X-Refresh-Secret: ${REFRESH_SECRET}" \
            -H "Content-Type: application/json")

          echo "Refresh response: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Metadata refresh triggered successfully"
          else
            echo "⚠️ Refresh returned HTTP $HTTP_CODE (worker deployed OK, refresh can be retried)"
          fi
