name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/r2-metadata-cache/**"

  # Manual trigger from Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: workers/r2-metadata-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/r2-metadata-cache

      - name: Post-deploy – trigger metadata refresh (batched)
        if: success()
        env:
          WORKER_URL: ${{ secrets.METADATA_WORKER_URL }}
          REFRESH_SECRET: ${{ secrets.METADATA_REFRESH_SECRET }}
          BATCH_SIZE: 10
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$REFRESH_SECRET" ]; then
            echo "⚠️ Skipping refresh trigger — METADATA_WORKER_URL or METADATA_REFRESH_SECRET not set"
            exit 0
          fi

          echo "Triggering batched POST /refresh on deployed worker..."

          OFFSET=0
          BATCH=1

          while true; do
            echo "── Batch $BATCH (offset=$OFFSET, limit=$BATCH_SIZE) ──"

            HTTP_CODE=0
            BODY=""
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 \
              -X POST "${WORKER_URL}/refresh?offset=${OFFSET}&limit=${BATCH_SIZE}" \
              -H "X-Refresh-Secret: ${REFRESH_SECRET}" \
              -H "Content-Type: application/json") || true

            if [ -n "$RESPONSE" ]; then
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')
            fi

            echo "  HTTP $HTTP_CODE — $BODY"

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "⚠️ Batch $BATCH returned HTTP $HTTP_CODE (worker deployed OK, refresh can be retried)"
              break
            fi

            PROBED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); b=d.get('batch'); print(b['probed'] if b else 0)" 2>/dev/null || echo "0")

            if [ "$PROBED" -lt "$BATCH_SIZE" ]; then
              echo "✅ All batches complete"
              break
            fi

            OFFSET=$((OFFSET + BATCH_SIZE))
            BATCH=$((BATCH + 1))
            sleep 2
          done
